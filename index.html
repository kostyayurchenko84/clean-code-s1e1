<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <header class="header">
      <img class="header__image" src="./eisenhower-matrix.jpg" alt="Диаграмма матрицы Эйзенхауэра">
      <a 
        class="more-info__link" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="todo-app">
      <section class="add-task">
        <h2 class="section-title">Add Item</h2>
        <div class="add-task-form">
          <label for="new-task" class="task__label_hidden">New task</label>
          <input 
            id="new-task"
            class="task-input task-title add-task__input"
            type="text"
          >
          <button class="btn">Add</button>
        </div>
      </section>
      <h2 class="section-title">Todo</h2>
      <ul id="todo-list" class="task-list">
        <li class="list-item">
          <input type="checkbox" class="task__checkbox">
          <label class="task-title task__label">Pay Bills</label>
          <input type="text" class="task-input task-title task__input_hidden">
          <button class="btn edit-task">Edit</button>
          <button class="btn delete-task">
            <img class="delete-task__icon" src="./remove.svg" alt="Удалить задачу">
          </button>
        </li>
        <li class="list-item edit-mode">
          <input type="checkbox" class="task__checkbox">
          <label class="task-title task__label task__label_hidden">Go Shopping</label>
          <input type="text" 
            value="Go Shopping"
            class="task-input task-title task__input_edit task__input_visible"
          >
          <button class="btn edit-task">Save</button>
          <button class="btn delete-task">
            <img class="delete-task__icon" src="./remove.svg" alt="Удалить задачу">
          </button>
        </li>
      </ul>
      <h2 class="section-title">Completed</h2>
      <ul id="done-tasks" class="task-list">
        <li class="list-item">
          <input type="checkbox" class="task__checkbox" checked>
          <label class="task-title task__label task__label_completed">See the Doctor</label>
          <input type="text" class="task-input task-title task__input_hidden">
          <button class="btn edit-task">Edit</button>
          <button class="btn delete-task">
            <img class="delete-task__icon" src="./remove.svg" alt="Удалить задачу">
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
